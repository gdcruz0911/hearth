<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Hearth</title>
    <link rel="stylesheet" href="assets/dashboard.css">
    <script defer src="assets/dashboard.js"></script>
    <script defer src="assets/hub.js"></script>
    <script defer src="assets/knowledge.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <h1 class="brand"><span class="ember-dot" aria-hidden="true"></span>Hearth</h1>
        <nav aria-label="Views">
          <a class="nav-item" href="#/hub" data-view="hub">Hub</a>
          <a class="nav-item" href="#/tasks" data-view="tasks">Tasks</a>
          <a class="nav-item" href="#/knowledge" data-view="knowledge">Knowledge</a>
        </nav>
        <p id="live" class="live" title="Refreshes every 5 seconds"><span class="live-dot" aria-hidden="true"></span><span id="live-text">Connecting</span></p>
        <h2 class="side-heading">Projects</h2>
        <ul id="projects" class="projects"></ul>
        <div class="settings">
          <label class="setting">Open on
            <select id="default-view">
              <option value="hub">Hub</option>
              <option value="tasks">Tasks</option>
              <option value="knowledge">Knowledge</option>
            </select>
          </label>
          <button id="theme" class="theme" type="button">Light mode</button>
        </div>
      </aside>
      <main class="main">
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>

        <div class="view hub-view" data-view="hub" hidden>
          <div id="hub-stage" class="hub-stage" aria-label="How projects, tasks, agents, and knowledge connect">
            <svg id="hub-svg" class="hub-svg" role="img" aria-labelledby="hub-title">
              <title id="hub-title">Hearth hub graph</title>
              <g id="hub-viewport"><g id="hub-links"></g><g id="hub-nodes"></g></g>
            </svg>
            <section class="needs-float" aria-labelledby="hub-needs-heading">
              <h2 id="hub-needs-heading">Needs you <span id="hub-needs-count" class="count-pill"></span></h2>
              <ul id="hub-needs" class="mini-rows"></ul>
            </section>
            <div class="hub-tools" role="group" aria-label="Show in the graph">
              <button type="button" class="chip on" data-type="task" aria-pressed="true">Tasks</button>
              <button type="button" class="chip on" data-type="run" aria-pressed="true">Agents</button>
              <button type="button" class="chip on" data-type="document" aria-pressed="true">Knowledge</button>
              <button type="button" class="chip" id="hub-reset" aria-label="Recenter the graph">Recenter</button>
            </div>
            <aside id="inspector" class="inspector" aria-labelledby="inspector-title" hidden>
              <header class="inspector-head">
                <h2 id="inspector-title"></h2>
                <button type="button" id="inspector-close" class="icon-button" aria-label="Close">
                  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                </button>
              </header>
              <div id="inspector-body" class="inspector-body"></div>
            </aside>
          </div>
        </div>

        <div class="view tasks-view" data-view="tasks" hidden>
          <div class="tasks-layout">
            <nav class="task-list" aria-label="Tasks">
              <div class="section-head">
                <h2>Tasks</h2>
                <p id="slots" class="slots"></p>
              </div>
              <h3 id="needs-heading" class="list-heading">Needs you</h3>
              <ul id="needs" class="cards" aria-labelledby="needs-heading"></ul>
              <h3 id="progress-heading" class="list-heading">In progress</h3>
              <ul id="progress" class="cards" aria-labelledby="progress-heading"></ul>
              <details id="finished-group" class="finished">
                <summary class="list-heading">Finished <span id="finished-count" class="count"></span></summary>
                <ul id="finished" class="cards"></ul>
              </details>
            </nav>
            <article id="task-detail" class="task-detail">
              <div id="task-summary"></div>
              <section id="task-session" class="task-session" hidden>
                <h3 id="session-heading" class="group"></h3>
                <ol id="session-log" class="transcript" aria-live="polite"></ol>
              </section>
            </article>
            <aside id="task-diff" class="task-diff" aria-label="Changes"></aside>
          </div>
        </div>

        <div class="view" data-view="knowledge" hidden>
          <section aria-labelledby="ask-heading">
            <h2 id="ask-heading" class="visually-hidden">Ask</h2>
            <form id="ask-form" class="ask">
              <input id="ask-question" type="search" placeholder="What did we decide about recall scope?" aria-label="Question" autocomplete="off">
              <label class="keyword"><input id="ask-keyword" type="checkbox"> Exact words</label>
              <button type="submit">Ask</button>
            </form>
            <div id="ask-result" class="ask-result" aria-live="polite"></div>
          </section>
          <section aria-labelledby="health-heading">
            <div class="section-head">
              <h2 id="health-heading">Collection</h2>
              <div class="toolbar">
                <button id="kn-import" class="btn" type="button">Import a file</button>
                <button id="kn-scan" class="btn" type="button" disabled>Review new files</button>
              </div>
            </div>
            <p id="health" class="meta"></p>
            <p id="kn-folders" class="meta"></p>
            <p id="kn-status" class="status" role="status" aria-live="polite" hidden></p>
            <ul id="attention" class="rows"></ul>
          </section>
          <section id="kn-panel" class="kn-panel" aria-label="Review" aria-live="polite" hidden></section>
          <section aria-labelledby="map-heading">
            <h2 id="map-heading">Map</h2>
            <svg id="kn-map" class="kmap" viewBox="0 0 640 340" role="group" aria-label="Interactive knowledge map"></svg>
            <p id="kn-map-summary" class="meta"></p>
          </section>
          <section aria-labelledby="index-heading">
            <h2 id="index-heading">Semantic index</h2>
            <div id="kn-index" class="kn-index"></div>
            <p id="kn-warning" class="status error" role="status" hidden></p>
          </section>
          <section aria-labelledby="sources-heading">
            <h2 id="sources-heading">Sources</h2>
            <input id="source-filter" type="search" placeholder="Filter sources" aria-label="Filter sources" class="filter">
            <ul id="sources" class="sources"></ul>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
