<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Hearth</title>
    <link rel="stylesheet" href="assets/app.css">
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="map-section" aria-labelledby="map-heading">
        <div id="map-surface" class="map-surface" role="region" aria-label="Interactive knowledge map">
          <div id="map-content" class="map-content">
            <svg id="map-links" class="map-links" aria-hidden="true"></svg>
            <div id="map-nodes" class="map-nodes"></div>
          </div>
          <div class="map-key" aria-label="Map key">
            <span><i class="key-dot key-dot-hearth"></i>Hearth</span>
            <span><i class="key-dot key-dot-neighborhood"></i>Semantic neighborhood</span>
            <span><i class="key-dot key-dot-document"></i>Source</span>
            <span><i class="key-line key-line-semantic"></i>Semantic link</span>
          </div>
        </div>

        <header class="topbar map-overlay">
          <div class="brand">
            <h1>Hearth</h1>
            <p id="status-message" class="status" role="status" aria-live="polite">Loading.</p>
          </div>
          <div class="topbar-actions">
            <button id="scan-sources-button" class="button" type="button">Review folders</button>
            <button id="import-button" class="button button-primary" type="button">Import a file</button>
          </div>
        </header>

        <section class="source-connection map-overlay" aria-labelledby="source-connection-heading">
          <div>
            <h2 id="source-connection-heading">Connected folders</h2>
            <p id="source-root-summary" class="subtle"></p>
          </div>
          <button id="scan-sources-panel-button" class="button" type="button">Review new files</button>
        </section>

        <header class="map-heading map-overlay">
          <h2 id="map-heading" class="sr-only">Knowledge map</h2>
          <dl id="health-summary" class="health-summary" aria-label="Collection health"></dl>
        </header>

        <footer class="map-footer">
          <p id="map-summary" class="map-summary"></p>
        </footer>

        <section class="support-grid map-overlay" aria-label="Collection tools">
          <section class="ask-panel" aria-labelledby="ask-heading">
          <h2 id="ask-heading">Ask the collection</h2>
          <form id="search-form">
            <label class="sr-only" for="question">Question</label>
            <input id="question" name="question" autocomplete="off" placeholder="Ask about your imported documents" required>
            <button class="button button-primary" type="submit">Ask Hearth</button>
          </form>
          <div id="answer-panel" class="answer-panel" hidden></div>
          </section>

          <aside id="detail-panel" class="detail-panel" aria-live="polite">
            <p class="empty-state">Select a source to inspect it, or follow a semantic link.</p>
          </aside>
        </section>

        <details class="collection-panel map-overlay">
          <summary>
            <span>
              <strong>Sources</strong>
            </span>
            <span id="document-count" class="count"></span>
          </summary>
          <div id="attention-panel" class="attention-panel" hidden></div>
          <div id="document-list" class="document-list"></div>
        </details>
      </section>
    </main>
  </body>
</html>
