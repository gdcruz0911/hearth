[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.1.0"
description = "Local-first, evidence-bound document chat foundation."
requires-python = ">=3.11"

[project.optional-dependencies]
local-inference = ["mlx-lm>=0.31.3,<0.32"]

[project.scripts]
hearth = "hearth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
