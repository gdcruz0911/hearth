[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.1.0"
description = "Local-first, evidence-bound personal knowledge hub."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
local-inference = ["mlx-lm>=0.31.3,<0.32"]

[project.scripts]
hearth = "hearth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hearth = ["web_assets/*.css", "web_assets/*.html", "web_assets/*.js"]
