<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The Hearth app icon: the titlebar's cut-core flame, honey to moss, on a white macOS tile. To redo hearth.icns: screenshot this file in Chromium at 16 to 1024 px with a transparent background, then iconutil -c icns. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3efe8"/></linearGradient>
    <linearGradient id="flame" gradientUnits="userSpaceOnUse" x1="12" y1="2.5" x2="12" y2="21">
      <stop offset="0" stop-color="#f9d47c"/><stop offset=".5" stop-color="#e0873a"/><stop offset="1" stop-color="#4b7a46"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a1a08" flood-opacity=".22"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#lift)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#2a1a08" stroke-opacity=".08"/>
  <path transform="translate(512 512) scale(31) translate(-12 -11.5)" fill="url(#flame)" fill-rule="evenodd" d="M12 2.8c.6 3.4 4.3 5.3 5.4 8.9a5.6 5.6 0 0 1-5.4 8.5 5.6 5.6 0 0 1-5.5-6.6c.4-2 1.7-3.3 2.6-4.6.3 1.7 1.2 2.6 2.4 3.1-.3-3.2-.4-6.4.5-9.3ZM12 20.2c-1.5 0-2.6-1.1-2.6-2.6 0-1.6 1.4-2.4 2-3.7.9 1.2 3.2 2 3.2 3.9 0 1.4-1.2 2.4-2.6 2.4Z"/>
</svg>
