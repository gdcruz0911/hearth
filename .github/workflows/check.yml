name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # A manual run, on the branch picked for it or on the commit given here.
    inputs:
      ref:
        description: "Commit, tag, or branch to check, with the steps of the branch picked above (default: that branch)"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}  # Empty except on a manual run, which keeps the event's own commit.
          fetch-depth: 0  # The session tests run the released v0.3.0 reader from its commit.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -e .
      - run: PYTHONPATH=src python -m unittest discover -s tests

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m venv .venv && .venv/bin/python -m pip install -e .
      - run: npm ci && npm test
        working-directory: desktop
